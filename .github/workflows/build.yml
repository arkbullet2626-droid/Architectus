name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Rebuild and re-upload the installer for this existing release tag (e.g. v0.1.0). Leave empty for a test build.'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # Releases: bump <Version> in Architectus.csproj and push to main. If no release
      # exists for v<Version> yet, this workflow creates the tag + release automatically.
      # Re-running with the "tag" input rebuilds and replaces that release's installer.
      - name: Work out version
        id: ver
        shell: pwsh
        run: |
          $mode = 'test'
          $tag = '${{ inputs.tag }}'
          if ($tag) { $mode = 'replace'; $v = $tag.TrimStart('v') }
          elseif ('${{ github.ref_type }}' -eq 'tag') { $tag = '${{ github.ref_name }}'; $v = $tag.TrimStart('v'); $mode = 'new' }
          else {
            [xml]$p = Get-Content src/Architectus/Architectus.csproj
            $v = ($p.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
            if ('${{ github.event_name }}' -eq 'push' -and '${{ github.ref_name }}' -eq 'main') { $tag = "v$v"; $mode = 'new' }
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "mode=$mode" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v  Tag '$tag'  Mode $mode"

      - name: Embed official meta-prompt (secret)
        shell: pwsh
        env:
          ARCHITECTUS_META_PROMPT: ${{ github.event_name != 'pull_request' && secrets.ARCHITECTUS_META_PROMPT || '' }}
        run: ./tools/Embed-MetaPrompt.ps1

      - name: Publish app
        shell: pwsh
        run: >
          dotnet publish src/Architectus/Architectus.csproj
          -c Release -r win-x64 -p:Platform=x64 --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      - name: Remove generated secret file
        if: always()
        shell: pwsh
        run: Remove-Item -Recurse -Force src/Architectus/Generated -ErrorAction SilentlyContinue

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build setup wizard
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} /DSourceDir=..\publish installer\Architectus.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v5
        with:
          name: Architectus-Setup-${{ steps.ver.outputs.version }}
          path: dist/*.exe

      - name: Publish GitHub release
        if: steps.ver.outputs.mode != 'test'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.ver.outputs.tag }}'
          $mode = '${{ steps.ver.outputs.mode }}'
          $file = Get-ChildItem dist/*.exe | Select-Object -First 1
          gh release view $tag --repo '${{ github.repository }}' *> $null
          $exists = $LASTEXITCODE -eq 0
          if ($exists -and $mode -eq 'replace') {
            gh release upload $tag $file.FullName --clobber --repo '${{ github.repository }}'
          } elseif ($exists) {
            Write-Host "Release $tag already exists; bump <Version> to publish a new one. Skipping."
          } else {
            $sha = (git rev-parse HEAD).Trim()
            $notes = "release-notes/$tag.md"
            if (Test-Path $notes) { gh release create $tag $file.FullName --target $sha --title "Architectus $tag" --notes-file $notes --repo '${{ github.repository }}' }
            else { gh release create $tag $file.FullName --target $sha --title "Architectus $tag" --generate-notes --repo '${{ github.repository }}' }
          }
          exit 0
